version: 2

models:
  - name: stg_retail__activity
    description: "Weekly retail activity fact. 720 rows across 6 periods."
    columns:
      - name: period_ending_date
        tests: [not_null]
      - name: sps_customer_item_key
        tests: [not_null]
      - name: sps_customer_location_key
        tests: [not_null]
      - name: sps_retailer_name_key
        tests: [not_null]
      - name: net_sales_units
        tests: [not_null]
      - name: net_sales_retail
        tests: [not_null]
      - name: inventory_units
        tests: [not_null]

  - name: stg_retail__item
    description: "Item dimension with category hierarchy."
    columns:
      - name: sps_item_mapping_key
        tests: [not_null]
      - name: sps_retailer_name_key
        tests: [not_null]

  - name: stg_retail__location
    description: "Store dimension."
    columns:
      - name: sps_customer_location_key
        tests: [not_null, unique]
      - name: sps_retailer_name_key
        tests: [not_null]

  - name: stg_retail__retailer
    description: "Retailer metadata (12 retailers)."
    columns:
      - name: sps_retailer_name_key
        tests: [not_null, unique]